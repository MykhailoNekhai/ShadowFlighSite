<!DOCTYPE html>
<html lang="en" data-theme="ember">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shadow Flight leaderboard — top players ranked by score">
    <title>Shadow Flight · Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html[data-theme="ember"] {
            --bg:           #07090c;
            --surface:      rgba(14, 18, 24, 0.82);
            --border:       rgba(255, 197, 109, 0.14);
            --border-acc:   rgba(255, 177, 74, 0.28);
            --text:         #f6efe2;
            --muted:        #7a6e62;
            --accent:       #ffb14a;
            --accent-soft:  rgba(255, 177, 74, 0.14);
            --gold:         #fbbf24;
            --atm-a:        rgba(255,177,74,0.13);
            --atm-b:        rgba(255,109,27,0.07);
            --row-hover:    rgba(255,255,255,0.025);
            --rank-bg:      rgba(255,255,255,0.05);
            --head-bg:      rgba(255,255,255,0.03);
            --card-shadow:  0 32px 80px rgba(0,0,0,0.45);
            --toggle-bg:    rgba(14,18,24,0.78);
            --toggle-icon:  #ffb14a;
        }

        html[data-theme="ivory"] {
            --bg:           #f4ebde;
            --surface:      rgba(253, 248, 242, 0.88);
            --border:       rgba(198, 170, 132, 0.38);
            --border-acc:   rgba(201, 163, 106, 0.4);
            --text:         #2f2218;
            --muted:        #8d6842;
            --accent:       #b88f58;
            --accent-soft:  rgba(201, 163, 106, 0.16);
            --gold:         #a0722a;
            --atm-a:        rgba(160,100,25,0.18);
            --atm-b:        rgba(120,70,15,0.10);
            --row-hover:    rgba(0,0,0,0.025);
            --rank-bg:      rgba(0,0,0,0.05);
            --head-bg:      rgba(0,0,0,0.03);
            --card-shadow:  0 16px 48px rgba(84,55,30,0.14);
            --toggle-bg:    rgba(252,247,240,0.95);
            --toggle-icon:  #8f6842;
        }

        body {
            font-family: "Inter", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .atm {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .atm::before {
            content: "";
            position: absolute;
            width: 900px; height: 900px;
            top: -25%; left: -18%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--atm-a) 0%, transparent 68%);
            filter: blur(80px);
        }
        .atm::after {
            content: "";
            position: absolute;
            width: 600px; height: 600px;
            bottom: 5%; right: -12%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--atm-b) 0%, transparent 68%);
            filter: blur(100px);
        }

        /* ── topbar ── */
        .topbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        .theme-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--toggle-bg);
            color: var(--toggle-icon);
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .theme-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-soft);
            transform: scale(1.08);
        }
        .theme-btn:active { transform: scale(0.94); }
        .icon-moon, .icon-sun { display: none; }
        html[data-theme="ember"] .icon-moon { display: block; }
        html[data-theme="ivory"] .icon-sun  { display: block; }

        /* ── layout ── */
        .page {
            position: relative;
            z-index: 1;
            width: min(820px, calc(100% - 32px));
            margin: 0 auto;
            padding-bottom: 80px;
        }

        .lb-header { margin: 40px 0 36px; }

        .lb-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--border-acc);
            border-radius: 999px;
            padding: 6px 14px;
            margin-bottom: 16px;
        }

        .lb-title {
            font-size: clamp(2.4rem, 6vw, 3.6rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .lb-title span {
            background: linear-gradient(120deg, #fcd34d 0%, var(--accent) 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lb-meta {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .lb-meta strong { color: var(--text); font-weight: 600; }

        /* ── card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 380px; }

        thead tr {
            background: var(--head-bg);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 13px 20px;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }
        .player-row { transition: background 0.14s; }
        .player-row:hover { background: var(--row-hover); }

        .row--top-1 { background: rgba(251,191,36,0.07); }
        .row--top-2 { background: rgba(148,163,184,0.04); }
        .row--top-3 { background: rgba(201,124,69,0.05); }

        .td-rank { width: 60px; }

        .ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px; height: 36px;
            border-radius: 50%;
            padding: 2.5px;
            flex-shrink: 0;
        }
        .ring-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: var(--bg);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .ring--gold {
            background: linear-gradient(135deg, #d97706 0%, #fde68a 50%, #b45309 100%);
            filter: drop-shadow(0 0 7px rgba(245,158,11,0.7));
        }
        .ring--gold .ring-inner { color: #f59e0b; }

        .ring--silver {
            background: linear-gradient(135deg, #64748b 0%, #f1f5f9 50%, #94a3b8 100%);
            filter: drop-shadow(0 0 6px rgba(148,163,184,0.55));
        }
        .ring--silver .ring-inner { color: #94a3b8; }

        .ring--bronze {
            background: linear-gradient(135deg, #92400e 0%, #fca97c 50%, #c97c45 100%);
            filter: drop-shadow(0 0 6px rgba(201,124,69,0.5));
        }
        .ring--bronze .ring-inner { color: #c97c45; }

        .rank-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px; height: 30px;
            border-radius: 8px;
            background: var(--rank-bg);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
        }

        .td-name {
            font-weight: 600;
            color: var(--text);
            max-width: 340px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .row--top-1 .td-name { color: var(--gold); }

        .td-score {
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--accent);
            font-size: 1.05rem;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 60px 20px;
        }

        .refresh-note {
            margin-top: 22px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
        }

        @media (max-width: 560px) {
            .page { padding-bottom: 48px; }
            .lb-title { font-size: 2rem; }
            th, td { padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="page">

        <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">

    <header class="lb-header">

    <div class="card">
        <div class="table-wrap">

</div>
<script>
    (function () {
        var html = document.documentElement;
        var btn = document.getElementById("themeToggle");
        var saved = localStorage.getItem("sf-lb-theme");
        if (saved === "ivory" || saved === "ember") html.setAttribute("data-theme", saved);
        btn.addEventListener("click", function () {
            var next = html.getAttribute("data-theme") === "ember" ? "ivory" : "ember";
            html.setAttribute("data-theme", next);
            localStorage.setItem("sf-lb-theme", next);
        });
    })();
</script>
